name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      # Installed directly (rather than via golangci-lint-action) so CI
      # runs the exact same v2 binary and config schema (.golangci.yml's
      # `version: "2"`) verified locally, instead of depending on which
      # golangci-lint major version the action defaults to.
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - run: golangci-lint run ./...

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - run: go build ./...
      - run: go test -race -count=1 ./...

  # Runs on the same runner's Docker daemon: testcontainers-go spins up its
  # own Postgres/Redis containers directly, no docker-compose services
  # block needed here.
  integration-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - run: go test -race -count=1 -tags=integration ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx oxlint .
      - run: npm run build

  # Validates the Dockerfiles actually build (including the frontend ->
  # embed pipeline in Dockerfile.apiserver) without publishing anywhere.
  build:
    runs-on: ubuntu-latest
    needs: [lint, test, integration-test, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile.apiserver -t goflow-apiserver .
      - run: docker build -f backend/Dockerfile.worker -t goflow-worker .
      - run: docker build -f backend/Dockerfile.dispatcher -t goflow-dispatcher .
